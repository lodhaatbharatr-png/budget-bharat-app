name: Build Android APK

on:
  push:
    branches:
      - main
      - fix/offline-data-backup-hardening
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: gradle

      - name: Install NPM Dependencies
        run: npm install

      - name: Build Web Assets (Vite)
        run: npm run build

      - name: Initialize Android Platform and Generate Assets
        run: |
          npx cap add android
          npx @capacitor/assets generate --android
          npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Verify APK Output
        run: test -f android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BudgetBharat-App-${{ github.ref_name }}-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
